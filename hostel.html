<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDU | Hostel Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="portal-body">
  <div id="nav-container"></div>

  <main class="portal-main">
    <div class="page-title-bar">
      <h1 class="page-title">Hostel Details <span class="page-title-sub">PATHAK RUDRA VISHALBHAI</span></h1>
    </div>

    <div class="generic-card">
      <div class="ia-card-header" style="padding:14px 20px;">Hostel Allotment Information</div>
      <div class="inner-tabs">
        <button class="inner-tab active" onclick="switchInnerTab(this,'h-allotment')">Room Allotment</button>
        <button class="inner-tab" onclick="switchInnerTab(this,'h-fee')">Hostel Fee</button>
        <button class="inner-tab" onclick="switchInnerTab(this,'h-mess')">Mess Details</button>
      </div>
      <div id="h-allotment" class="inner-tab-content active">
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Hostel allotment record found for this student.
        </div>
      </div>
      <div id="h-fee" class="inner-tab-content">
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Hostel fee records found.
        </div>
      </div>
      <div id="h-mess" class="inner-tab-content">
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Mess detail records found.
        </div>
      </div>
    </div>
  </main>

  <script src="nav.js"></script>
  <script>
    initNav('hostel');
    function switchInnerTab(btn, tabId) {
      document.querySelectorAll('.inner-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.inner-tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
