<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDU | Internship Detail</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="portal-body">
  <div id="nav-container"></div>

  <main class="portal-main">
    <div class="page-title-bar">
      <h1 class="page-title">Internship Detail <span class="page-title-sub">PATHAK RUDRA VISHALBHAI</span></h1>
    </div>

    <div class="generic-card">
      <div class="inner-tabs">
        <button class="inner-tab active" onclick="switchInnerTab(this,'t-details')">Internship Details</button>
        <button class="inner-tab" onclick="switchInnerTab(this,'t-approval')">Approval Status</button>
        <button class="inner-tab" onclick="switchInnerTab(this,'t-work')">Work Entry</button>
      </div>
      <div id="t-details" class="inner-tab-content active">
        <div class="generic-card-header" style="padding:10px 0; margin-bottom:10px;">&#128196; Internship Details</div>
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Record Found
        </div>
      </div>
      <div id="t-approval" class="inner-tab-content">
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Approval records found.
        </div>
      </div>
      <div id="t-work" class="inner-tab-content">
        <div class="no-record-box">
          <span class="no-record-icon">&#10060;</span> No Work Entry records found.
        </div>
      </div>
    </div>
  </main>

  <script src="nav.js"></script>
  <script>
    initNav('internship');
    function switchInnerTab(btn, tabId) {
      document.querySelectorAll('.inner-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.inner-tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
